name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ripgrep and Pygments
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep; else brew install ripgrep; fi
          python -m pip install --quiet pygments
      - name: Git identity for the test repositories
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: review-desk
        working-directory: skills/review-desk
        run: |
          python -m unittest discover -s tests -v
          python -m unittest evals/test_harness.py
      - name: implementation-summary
        working-directory: skills/implementation-summary
        run: python -m unittest discover -s tests
      - name: analyze-code worked example builds without layout warnings
        working-directory: skills/analyze-code
        run: |
          python scripts/examples/url_shortener.py "$RUNNER_TEMP/example.html" | tee "$RUNNER_TEMP/report.txt"
          test -s "$RUNNER_TEMP/example.html"
          grep -q "^no layout warnings$" "$RUNNER_TEMP/report.txt"
